org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Il progetto sta su D: e il pub cache su C:, cosi' i sorgenti dei plugin e
# questo progetto sono su due dischi diversi. Il compilatore incrementale di
# Kotlin non sa rendere relative quelle path e fa fallire la build con
# "this and base files have different roots" su :shared_preferences_android.
# Qui la compilazione di Kotlin e' comunque minima (MainActivity + i plugin),
# quindi compilarla da zero non si nota.
kotlin.incremental=false
