# Build and release of the Android APK and of the iOS IPA.
#
# This file is the pipeline: it holds the triggers and the order of the jobs. Every job is
# one line long, because the work of each of them lives in a workflow of its own, next to
# this one in `.github/workflows/`, with the name of what it does (read-version.yml,
# build-apk.yml, ...). To read a block you open one file with a telling name instead of
# scrolling through this one.
#
# Triggers:
#   - push to `master`       -> builds the APK and keeps it as a workflow artifact
#   - push of a `v*` tag     -> publishes the GitHub Release with the APK (and the IPA)
#       - tag `v1.0.4`          -> stable release: it becomes the repository "latest"
#       - tag `v1.0.5-SNAPSHOT` -> build of `develop`: goes out as a pre-release, latest untouched
#   - manually from the Actions tab (`workflow_dispatch`)
#
# The IPA is built by the `ios` job only, which runs **on stable tags only** (the reason is
# in that job): on `master`, on a `workflow_dispatch` and on snapshots the release ships the
# APK alone, and neither the notes nor the Telegram message name an IPA that is not there.
#
# The branches follow git flow: `master` is production, `develop` is integration, releases
# branch off `release/*` and emergency fixes off `hotfix/*` (see AGENTS.md).
#
# Note: GitHub runs the workflow stored in the pushed commit, so this file has to exist on
# the branch/commit that triggers it (for a tag: on the tagged commit), otherwise the
# pipeline never starts. A pipeline change living only on `develop` is invisible to a
# release until it has reached `master`.
name: Build and release (APK + IPA)

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

# Needed to create the release (write access to the contents of the repository). It is
# declared here as well as in release.yml because a reusable workflow is granted only what
# the caller and the file itself both allow.
permissions:
  contents: write

jobs:
  # The version is read once and used by every job: the same label and the same build number
  # end up in the APK, in the IPA and in the names of the files attached to the release.
  version:
    name: Compute the version
    uses: ./.github/workflows/read-version.yml

  build:
    name: Build the APK
    needs: version
    uses: ./.github/workflows/build-apk.yml
    with:
      build-name: ${{ needs.version.outputs.name }}
      build-number: ${{ needs.version.outputs.number }}
      file-name: ${{ needs.version.outputs.apk }}

  # The IPA needs `macos-latest` because Xcode exists only there: minutes on a macOS runner
  # are billed 10 times the Linux ones, so this is the most expensive job of the pipeline.
  #
  # It starts **on stable releases only** (`v1.0.4`): on a push to `master`, on a
  # `workflow_dispatch` and on the snapshots of `develop` it is skipped. Those expensive
  # minutes would not change anything (the IPA of a snapshot has to be re-signed to be
  # installed anyway, and whoever tries `develop` wants the APK) and the release does not
  # depend on this job: without the IPA it only skips the artifact download.
  ios:
    name: Build the IPA
    needs: version
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-SNAPSHOT')
    uses: ./.github/workflows/build-ipa.yml
    with:
      build-name: ${{ needs.version.outputs.name }}
      build-number: ${{ needs.version.outputs.number }}
      file-name: ${{ needs.version.outputs.ipa }}

  release:
    name: Publish the GitHub Release
    needs: [version, build, ios]
    # Tags `v*` only: a push to `master` builds the artifacts but publishes nothing.
    # A `develop` tag (`v1.0.5-SNAPSHOT`) goes out as a **pre-release** and does not become
    # the repository "latest": that place stays with the stable releases tagged on `master`.
    #
    # `!cancelled()` and the check on the APK keep the release safe from iOS: on snapshots
    # the `ios` job is skipped, but a macOS runner out of minutes or Xcode changing its mind
    # must not stop the APK that has already been built from being published. A skipped or
    # failed job does not "cancel" the workflow, so the release starts anyway.
    if: >-
      !cancelled()
      && startsWith(github.ref, 'refs/tags/v')
      && needs.build.result == 'success'
    uses: ./.github/workflows/release.yml
    with:
      label: ${{ needs.version.outputs.label }}
      tag: ${{ github.ref_name }}
      apk: ${{ needs.version.outputs.apk }}
      ipa: ${{ needs.version.outputs.ipa }}
      snapshot: ${{ needs.version.outputs.snapshot }}
      # `success` only when the IPA really is there: the notes and the Telegram message name
      # it only in that case.
      ios-result: ${{ needs.ios.result }}
    secrets:
      telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}

  # Second publication channel: the same files also go to a private artifact repository
  # (Nexus/Artifactory), next to the GitHub Release. Same triggers as the release, so tags
  # only, stable and snapshot alike.
  #
  # It is a job of its own so that it can never hold the release back: `release` does not
  # `need` it, the two start together and each one finishes on its own, and inside the called
  # workflow every problem is a warning. A private repository that does not answer leaves the
  # run green and the release published. It was the first thing to break while the server was
  # being set up, and it has to stay the least important piece of the pipeline.
  publish-private:
    name: Publish to the private repository
    needs: [version, build, ios]
    if: >-
      !cancelled()
      && startsWith(github.ref, 'refs/tags/v')
      && needs.build.result == 'success'
    uses: ./.github/workflows/publish-private.yml
    with:
      path: ${{ needs.version.outputs.label }}
      ios-result: ${{ needs.ios.result }}
    secrets:
      username: ${{ secrets.PRIVATE_REPO_USER }}
      password: ${{ secrets.PRIVATE_REPO_PASSWORD }}
