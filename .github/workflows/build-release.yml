# Build e release dell'APK Android.
#
# Si attiva su:
#   - push sul ramo `main`  -> costruisce l'APK e lo lascia come artefatto del workflow
#   - push di un tag `v*`   -> costruisce l'APK e crea la GitHub Release con l'APK allegato
#   - manualmente dalla scheda Actions (`workflow_dispatch`)
#
# Nota: GitHub esegue il workflow che sta nel commit spinto, quindi questo file deve
# esistere sul ramo/commit interessato (per i tag: sul commit taggato), altrimenti la
# pipeline non parte.
#
# Le action sono fissate ai tag di major mobili (vN): si aggiornano a mano. Da v5/v6
# in poi girano su Node 24 e vogliono un runner >= 2.327.1: `ubuntu-latest` va bene,
# su runner self-hosted no. `subosito/flutter-action` e' l'unica ancora a `v2`.
name: Build APK e release

on:
  push:
    # Il ramo di casa e' `master`: con `main` questo trigger non scattava mai
    # (il repo non ha quel ramo), quindi i push normali non costruivano nulla.
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

# Serve a creare la release (scrittura sui contenuti del repo).
permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.4

jobs:
  build:
    name: Build APK release
    runs-on: ubuntu-latest
    # Il nome del file APK viaggia fino al job della release, che lo usa per il
    # link diretto da mandare su Telegram.
    outputs:
      file: ${{ steps.versione.outputs.file }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dipendenze
        run: flutter pub get

      # `flutter analyze` esce con codice 1 per i 12 `info` preesistenti in lib/main.dart,
      # quindi qui e' solo informativo e non fa fallire la build.
      - name: Analisi statica (non bloccante)
        run: flutter analyze lib
        continue-on-error: true

      # La versione sta in `version:` di pubspec.yaml (`nome+numero`) ed e' l'unica
      # fonte: la usano anche `flutter run` e `tool/build_apk.ps1`, quindi l'APK qui
      # costruito e quello locale hanno la stessa etichetta e lo stesso versionCode.
      # Il tag fornisce il nome della release; il numero di build non deve mai calare
      # (Android rifiuta l'installazione con INSTALL_FAILED_VERSION_DOWNGRADE).
      - name: Calcola la versione
        id: versione
        shell: bash
        run: |
          pubspec="$(sed -n 's/^version: *//p' pubspec.yaml | head -n1)"
          nome="${pubspec%%+*}"
          numero="${pubspec##*+}"
          if [[ ! "$numero" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::version: '$pubspec' non ha la forma nome+numero (es. 1.0.2+3)"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ "$tag" != "$nome" ]]; then
              echo "::warning::Il tag $GITHUB_REF_NAME non combacia col version: '$pubspec' di pubspec.yaml"
            fi
            nome="$tag"
          fi
          echo "nome=$nome" >> "$GITHUB_OUTPUT"
          echo "numero=$numero" >> "$GITHUB_OUTPUT"
          echo "file=MTG-Life-Counter-$nome-build$numero.apk" >> "$GITHUB_OUTPUT"
          echo "Versione $nome+$numero"

      # La release e' firmata con la debug key (android/app/build.gradle.kts): va bene
      # per il sideload, non per pubblicare sul Play Store.
      - name: Build APK release
        run: |
          flutter build apk --release \
            --build-name "${{ steps.versione.outputs.nome }}" \
            --build-number "${{ steps.versione.outputs.numero }}"

      # Nome del file: MTG-Life-Counter-<versione>-build<numero>.apk. Uguale a quello
      # che produce `tool/build_apk.ps1` per lo stesso commit.
      - name: Prepara l'artefatto
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/${{ steps.versione.outputs.file }}"

      - name: Salva l'APK come artefatto
        uses: actions/upload-artifact@v7
        with:
          name: mtg-lifecounter-apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Crea la GitHub Release
    needs: build
    # Solo per i tag `v*`: un push su `main` costruisce l'APK ma non pubblica niente.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Scarica l'APK
        uses: actions/download-artifact@v8
        with:
          name: mtg-lifecounter-apk
          path: dist

      - name: Pubblica la release
        uses: softprops/action-gh-release@v3
        with:
          name: MTG Life Counter ${{ github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
          body: |
            APK per il sideload: la build e' firmata con la debug key, quindi non
            va pubblicata sul Play Store.

            Installazione: copiare l'APK sul telefono e aprirlo, oppure
            `adb install -r MTG-Life-Counter-*.apk`.

      # Avviso su Telegram con il link diretto all'APK pubblicato. Servono due
      # segreti del repository:
      #   TELEGRAM_BOT_TOKEN  token del bot (BotFather)
      #   TELEGRAM_CHAT_ID    id della chat che riceve l'avviso
      # Se mancano la notifica viene saltata e la release resta valida.
      - name: Notifica su Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_FILE: ${{ needs.build.outputs.file }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID non configurati: notifica saltata."
            exit 0
          fi

          repo="https://github.com/$GITHUB_REPOSITORY"
          apk_url="$repo/releases/download/$TAG/$APK_FILE"
          release_url="$repo/releases/tag/$TAG"

          # Il tag finisce nel messaggio in HTML: l'escaping evita che un
          # carattere strano (es. `&` o `<`) rompa il parse di Telegram.
          titolo="${TAG//&/&amp;}"
          titolo="${titolo//</&lt;}"
          titolo="${titolo//>/&gt;}"

          testo="$(
            printf '%s\n' \
              "<b>MTG Life Counter $titolo</b>" \
              "Nuova release: APK pronto per il sideload." \
              "" \
              "<a href=\"$apk_url\">$APK_FILE</a>" \
              "<a href=\"$release_url\">Note e dettagli</a>"
          )"

          # Il testo lo codifica curl: niente escaping a mano nella query.
          curl -sS --fail --retry 3 --retry-connrefused \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=$testo" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" > /dev/null

          echo "Notifica inviata per $APK_FILE"
